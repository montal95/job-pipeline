<!--
  ZipRecruiter job card fixture — minimal representative DOM.
  Reflects the structure of ziprecruiter.com/jobs-search results as of early 2026.
  Used by test_parse_ziprecruiter_cards_* tests only. Not scraped from a live page.

  Selector targets used by _parse_ziprecruiter_cards:
    card:        article.job_result
    title:       h2.job_title > a  (text + href)
    company:     a.company_name
    location:    span.location
    salary:      span.compensation  (optional)
-->
<html>
<body>
<div class="jobs_list">

  <!-- Card 1: full fields including salary range -->
  <article class="job_result">
    <h2 class="job_title">
      <a href="/c/Acme/j/abc111">Senior Software Engineer</a>
    </h2>
    <a class="company_name">Acme Corp</a>
    <span class="location">Chicago, IL</span>
    <span class="compensation">$120,000 - $150,000/yr</span>
  </article>

  <!-- Card 2: remote role, hourly rate -->
  <article class="job_result">
    <h2 class="job_title">
      <a href="/c/DataCo/j/abc222">AI Engineer</a>
    </h2>
    <a class="company_name">DataCo</a>
    <span class="location">Remote</span>
    <span class="compensation">$80/hr</span>
  </article>

  <!-- Card 3: missing company element — should be skipped gracefully -->
  <article class="job_result">
    <h2 class="job_title">
      <a href="/c/Unknown/j/abc333">DevOps Engineer</a>
    </h2>
    <span class="location">Austin, TX</span>
  </article>

</div>
</body>
</html>
