<!--
  Minimal LinkedIn job search results page fixture.
  Reflects the DOM structure of linkedin.com/jobs/search/ as of early 2026.
  Three cards: two complete, one missing company (tests graceful skip).
  Used by test_parse_linkedin_cards_* tests — no live browser required.
-->
<html>
<body>
  <div class="jobs-search__results-list">

    <div class="job-search-card">
      <h3 class="base-search-card__title">Senior Rails Engineer</h3>
      <h4 class="base-search-card__subtitle">
        <a class="hidden-nested-link">Acme Health</a>
      </h4>
      <span class="job-search-card__location">Chicago, IL</span>
      <a class="base-card__full-link" href="/jobs/view/123456789/?refId=abc"></a>
      <span class="job-search-card__salary-info">$140K/yr - $170K/yr</span>
    </div>

    <div class="job-search-card">
      <h3 class="base-search-card__title">Full Stack Developer</h3>
      <h4 class="base-search-card__subtitle">
        <a class="hidden-nested-link">TechStartup Inc</a>
      </h4>
      <span class="job-search-card__location">Remote</span>
      <a class="base-card__full-link" href="/jobs/view/987654321/?refId=def"></a>
    </div>

    <div class="job-search-card">
      <h3 class="base-search-card__title">Backend Engineer</h3>
      <!-- company element intentionally absent — tests graceful skip -->
      <span class="job-search-card__location">New York, NY</span>
      <a class="base-card__full-link" href="/jobs/view/111222333/?refId=ghi"></a>
    </div>

  </div>
</body>
</html>
