<!DOCTYPE html>
<html>
<head><title>Apply - Acme Health</title></head>
<body>
<h1>Application for Senior Software Engineer</h1>
<form id="application_form" action="/apply" method="post" enctype="multipart/form-data">

  <div class="field">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>
  </div>

  <div class="field">
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" required>
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>
  </div>

  <div class="field">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
  </div>

  <div class="field">
    <label for="resume">Resume (PDF or Word)</label>
    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
  </div>

  <div class="field">
    <label for="cover_letter">Cover Letter (optional)</label>
    <input type="file" id="cover_letter" name="cover_letter" accept=".pdf,.doc,.docx">
  </div>

  <!-- Hidden file input — still accessible via Playwright setInputFiles -->
  <input type="file" id="resume_hidden" name="resume_hidden" style="display:none">

  <div class="field">
    <label for="linkedin_url">LinkedIn Profile URL</label>
    <input type="text" id="linkedin_url" name="linkedin_url">
  </div>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
