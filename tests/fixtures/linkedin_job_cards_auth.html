<!--
  LinkedIn authenticated job card fixture — DOM structure for logged-in search results.
  Confirmed via Claude in Chrome DevTools inspection of live LinkedIn search (March 2026).

  Confirmed selectors:
    card:      div.job-card-container  (data-job-id attribute carries job ID)
    title:     a.job-card-container__link span[aria-hidden="true"]
    company:   .artdeco-entity-lockup__subtitle span
    location:  .artdeco-entity-lockup__caption
    salary:    [class*="salary"]  (rarely present; null in most results)
    url:       constructed as https://www.linkedin.com/jobs/view/{data-job-id}
-->
<html>
<body>
<ul class="jobs-search-results__list">

  <!-- Card 1: full fields including salary -->
  <li class="jobs-search-results__list-item">
    <div class="display-flex job-card-container" data-job-id="auth-111111">
      <div class="artdeco-entity-lockup">
        <div class="artdeco-entity-lockup__subtitle">
          <span>Acme Health</span>
        </div>
        <div class="artdeco-entity-lockup__caption">Chicago, IL</div>
      </div>
      <a class="job-card-container__link" href="/jobs/view/auth-111111/">
        <span aria-hidden="true">Senior Rails Engineer</span>
      </a>
      <span class="job-card-container__salary-info">$140K/yr - $170K/yr</span>
    </div>
  </li>

  <!-- Card 2: remote role, no salary -->
  <li class="jobs-search-results__list-item">
    <div class="display-flex job-card-container" data-job-id="auth-222222">
      <div class="artdeco-entity-lockup">
        <div class="artdeco-entity-lockup__subtitle">
          <span>TechStartup Inc</span>
        </div>
        <div class="artdeco-entity-lockup__caption">United States (Remote)</div>
      </div>
      <a class="job-card-container__link" href="/jobs/view/auth-222222/">
        <span aria-hidden="true">Full Stack Developer</span>
      </a>
    </div>
  </li>

  <!-- Card 3: missing company — should be skipped gracefully -->
  <li class="jobs-search-results__list-item">
    <div class="display-flex job-card-container" data-job-id="auth-333333">
      <div class="artdeco-entity-lockup">
        <div class="artdeco-entity-lockup__caption">New York, NY</div>
      </div>
      <a class="job-card-container__link" href="/jobs/view/auth-333333/">
        <span aria-hidden="true">Backend Engineer</span>
      </a>
    </div>
  </li>

</ul>
</body>
</html>
