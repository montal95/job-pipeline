[project]
name = "job-pipeline"
version = "0.1.0"
description = "LangGraph multi-agent job application pipeline — OSS reference implementation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.47.0; sys_platform == 'win32'",
    "python-docx>=1.1.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=4.0.0",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
